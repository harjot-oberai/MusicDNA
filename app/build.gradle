// build flavor setup based off of https://github.com/slapperwan/gh4a/blob/master/app/build.gradle
def taskRequests = getGradle().getStartParameter().getTaskRequests().toString()
def isPlaystore = taskRequests.contains("Playstore") || taskRequests.contains("playstore")

apply plugin: 'com.android.application'
apply plugin: 'com.github.ben-manes.versions'
//apply plugin: 'net.jthink.jaudiotagger' // not correct, try to figure out correct reference
if (isPlaystore) {
    apply plugin: 'io.fabric'
}

android {
    compileSdkVersion 28
    buildToolsVersion '28.0.2'
    defaultConfig {
        applicationId "com.sdsmdg.harjot.MusicDNA"
        minSdkVersion 21
        targetSdkVersion 28
        versionCode 37
        versionName "2.0.0"

        renderscriptTargetApi 23
        renderscriptSupportModeEnabled true
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            zipAlignEnabled true
        }
    }

    flavorDimensions "flavor"
    productFlavors {
        playstore {
            dimension "flavor"
            buildConfigField "boolean", "USE_CRASHLYTICS", "true"
            ext.enableCrashlytics = true
        }

        fdroid {
            dimension "flavor"
            buildConfigField "boolean", "USE_CRASHLYTICS", "false"
            ext.enableCrashlytics = false
        }
    }

	compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

ext {
	supportLib = '28.0.0-rc02'
	leakCanary = '1.6.1'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

	// support libraries
	implementation "com.android.support:design:${supportLib}"
	implementation "com.android.support:support-v4:${supportLib}"
	implementation "com.android.support:appcompat-v7:${supportLib}"
	implementation "com.android.support:cardview-v7:${supportLib}"
    implementation "com.android.support:palette-v7:${supportLib}"
    implementation "com.android.support:exifinterface:${supportLib}"

	// jp.wasabeef
    implementation 'jp.wasabeef:recyclerview-animators:2.3.0'
	implementation 'jp.wasabeef:blurry:2.1.1'

	// squareup
    implementation 'com.squareup.retrofit2:retrofit:2.4.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.4.0'
    implementation 'com.squareup.okhttp3:okhttp:3.11.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.11.0'
    implementation 'com.squareup.picasso:picasso:2.71828'
    //implementation 'com.squareup.picasso3:picasso:3.0.0-SNAPSHOT'
    // ^ add https://oss.sonatype.org/content/repositories/snapshots/ to build.gradle for this

	// github
	implementation 'com.github.bumptech.glide:glide:4.8.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.8.0'
	implementation 'com.github.mmin18:realtimeblurview:1.1.2'
    implementation 'com.github.QuadFlask:colorpicker:0.0.13'
    implementation 'com.github.amlcurran.showcaseview:library:5.4.3'

	// misc
	implementation 'org.jsoup:jsoup:1.11.3'
    implementation 'de.hdodenhof:circleimageview:2.2.0'
    implementation 'bz.tsung.android:objectify:2.0'
    implementation 'com.wang.avi:library:2.1.3'
    implementation 'com.nineoldandroids:library:2.4.0'
    implementation 'com.diogobernardino:williamchart:2.5.0'
    implementation 'tyrantgit:explosionfield:1.0.1'
    implementation 'com.google.code.gson:gson:2.8.5'
    implementation 'com.h6ah4i.android.widget.verticalseekbar:verticalseekbar:0.7.2'
    implementation 'me.priyesh:chroma:1.0.2'
    implementation 'cn.aigestudio.wheelpicker:WheelPicker:1.1.2'
    implementation 'com.lantouzi.wheelview:library:1.1.2'
    implementation 'de.psdev.licensesdialog:licensesdialog:1.8.3'

    playstoreImplementation('com.crashlytics.sdk.android:crashlytics:2.9.5@aar', {
		transitive = true })

	// test, release, debug
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test:rules:1.0.2'
    testImplementation "com.squareup.leakcanary:leakcanary-android-no-op:${leakCanary}"
    debugImplementation "com.squareup.leakcanary:leakcanary-android-no-op:${leakCanary}"
    releaseImplementation "com.squareup.leakcanary:leakcanary-android-no-op:${leakCanary}"
}
